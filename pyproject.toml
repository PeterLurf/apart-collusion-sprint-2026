[project]
name = "reading-the-decoder"
version = "1.0.0"
description = "How a colluding LLM monitor computes collusion: probing, patching and steering Qwen3-32B in a steganographic code-review game."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# rerunning the pipeline: MBPP, Claude API (backdoors, trusted monitor), Modal (GPU jobs)
pipeline = ["anthropic>=0.40", "datasets>=2.19", "modal>=1.0"]
# local GPU work outside Modal (the Modal images pin their own versions in src/rtd/modal_image.py)
gpu = ["accelerate>=1.0", "safetensors>=0.4", "torch>=2.6", "transformers>=4.51"]
notebook = ["jupyter>=1.0", "nbconvert>=7.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
